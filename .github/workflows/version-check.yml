name: Software Version Checker

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: "7 6 * * 2"

    # Runs every Thursday at 09:00 UTC
    - cron: "7 6 * * 4"

  # Allows you to run it manually from GitHub
  workflow_dispatch:


jobs:

  check-versions:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Download repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Install Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. Install Python dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 4. Install Playwright Chromium
      # ======================================================

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium


      # ======================================================
      # 5. Create Google credentials file
      # ======================================================

      - name: Create Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > gcredentials.json


      # ======================================================
      # 6. Run Python application
      # ======================================================

      - name: Run version checker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          python Final.py